<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم - إضافة سوفتوير</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fafafa; color: #333; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #4f46e5; margin-bottom: 4px; }
    .header p { color: #888; font-size: 13px; }
    
    .card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .card h3 { font-size: 15px; margin-bottom: 14px; color: #555; }
    
    label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-bottom: 12px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4f46e5; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-outline { background: #fff; color: #4f46e5; border: 1px solid #4f46e5; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    
    #dzProducts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #dzProducts button { background: #f1f5f9; border: 1px solid #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; }
    #dzProducts button:hover { background: #4f46e5; color: #fff; }
    
    #result { margin-top: 12px; font-size: 13px; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>لوحة تحكم - إضافة سوفتوير</h1>
      <p>إضافة ملفات سوفتوير جديدة بسهولة</p>
    </div>
    
    <div class="card">
      <h3>📥 استدعاء من DZBoard</h3>
      <button class="btn btn-outline btn-sm" onclick="loadDzProducts()">عرض منتجات DZBoard</button>
      <div id="dzProducts"></div>
    </div>
    
    <div class="card">
      <h3>📝 إضافة سوفتوير جديد</h3>
      <form onsubmit="saveFirmware(event)">
        <label>الماركة *</label>
        <select id="brand_id" required>
          <option value="">اختر الماركة...</option>
        </select>
        
        <label>الموديل *</label>
        <input type="text" id="model_number" required>
        
        <label>الإصدار</label>
        <input type="text" id="version">
        
        <label>رابط الملف</label>
        <input type="url" id="file_url">
        
        <label>تكلفة التوكنز</label>
        <input type="number" id="token_cost" value="500">
        
        <label>الوصف</label>
        <textarea id="description" rows="3"></textarea>
        
        <button type="submit" class="btn btn-primary">حفظ السوفتوير</button>
      </form>
      <div id="result"></div>
    </div>
  </div>

  <script>
    async function loadBrands() {
      try {
        const res = await fetch('/api/content/brands/');
        const data = await res.json();
        const select = document.getElementById('brand_id');
        (data.brands || []).forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = b.name;
          select.appendChild(opt);
        });
      } catch(e) { console.log('Error loading brands'); }
    }
    
    async function loadDzProducts() {
      const btn = event.target;
      btn.textContent = 'جاري التحميل...';
      try {
        const res = await fetch('https://dzboard.onrender.com/api/products');
        const data = await res.json();
        const products = data.products || [];
        document.getElementById('dzProducts').innerHTML = products.slice(0, 30).map(p => 
          `<button onclick='fillForm(${JSON.stringify(p)})'>${p.name}</button>`
        ).join('');
      } catch(e) {
        document.getElementById('dzProducts').innerHTML = '<p style="color:#ef4444">خطأ في الاتصال</p>';
      }
      btn.textContent = 'عرض منتجات DZBoard';
    }
    
    function fillForm(p) {
      document.getElementById('model_number').value = p.name || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('result').innerHTML = '<p class="success">✅ تم استدعاء المنتج</p>';
    }
    
    async function saveFirmware(e) {
      e.preventDefault();
      const data = {
        brand_id: document.getElementById('brand_id').value,
        model_number: document.getElementById('model_number').value,
        version: document.getElementById('version').value,
        file_url: document.getElementById('file_url').value,
        token_cost: document.getElementById('token_cost').value,
        description: document.getElementById('description').value,
      };
      
      const res = await fetch('/api/content/firmware/create/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await res.json();
      
      if (result.success) {
        document.getElementById('result').innerHTML = '<p class="success">✅ تم الحفظ بنجاح!</p>';
        e.target.reset();
      } else {
        document.getElementById('result').innerHTML = `<p class="error">❌ ${result.message}</p>`;
      }
    }
    
    loadBrands();
  </script>
</body>
</html>
